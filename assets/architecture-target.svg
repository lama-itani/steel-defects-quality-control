<text x="1455.0" y="969" text-anchor="middle"><tspan font-size="18" font-weight="normal" fill="#4b5563">run_batch_inspections.py → CDE · in-app ONNX → AI Inference · Streamlit → AI Application</tspan></text>
<text x="1455.0" y="999" text-anchor="middle"><tspan font-size="18" font-weight="normal" fill="#4b5563">Dashed orange = model lifecycle: retrain → register → deploy</tspan></text>
<text x="1455.0" y="1029" text-anchor="middle"><tspan font-size="18" font-weight="normal" fill="#4b5563">Green IN DEMO badge = runs in the AMP today · everything else is the target, not built</tspan></text>
<text x="1000" y="50" text-anchor="middle" font-size="36" font-weight="bold" fill="#1f2937">Steel Surface QC AI — Target Architecture on Cloudera</text>
<text x="1000" y="90" text-anchor="middle" font-size="21" font-weight="normal" fill="#4b5563">Mill cameras stream surface images, a U-Net model segments defects, engineers review, and a QC agent answers questions about the saved evidence</text>
<text x="358" y="172" text-anchor="start" font-size="27" font-weight="bold" fill="#e8711a">Cloudera Data Platform — on-prem or public cloud (CPU demo · NVIDIA GPU at scale)</text>
<text x="165" y="213" text-anchor="middle" font-size="19" font-weight="bold" fill="#4b5563" letter-spacing="2">SOURCES</text>
<text x="360" y="213" text-anchor="start" font-size="19" font-weight="bold" fill="#4b5563" letter-spacing="2.5">DATA &amp; MODEL PIPELINE — INGEST, STORE, BATCH, TRAIN</text>
<text x="388" y="513" text-anchor="start" font-size="23" font-weight="bold" fill="#1f2937">Cloudera AI — Steel QC Review App + QC Agent (Application)</text>
