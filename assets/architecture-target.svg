<text x="1682.5" y="583" text-anchor="middle"><tspan font-size="19" font-weight="normal" fill="#4b5563">agent LLM · OpenAI-compatible API</tspan></text>
<text x="1682.5" y="616" text-anchor="middle"><tspan font-size="19" font-weight="normal" fill="#4b5563">Monitoring: drift · latency · disagree rate</tspan></text>
