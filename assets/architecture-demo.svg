<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 580" width="1200" height="580" font-family="Helvetica, Arial, sans-serif">
  <title>Steel Surface QC — Demo Architecture</title>
  <defs>
    <marker id="g" viewBox="0 0 12 10" refX="11" refY="5" markerWidth="17" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0,0 L12,5 L0,10 z" fill="#5b6577"/>
    </marker>
  </defs>
  <rect width="1200" height="580" fill="#f7f8fa"/>
  <text x="600" y="42" text-anchor="middle" font-size="26" font-weight="bold" fill="#1f2937">Steel Surface QC — Demo Architecture (AMP)</text>

  <!-- Cloudera AI project -->
  <rect x="20" y="65" width="1160" height="355" rx="22" fill="#ffffff" stroke="#e8711a" stroke-width="3"/>
  <text x="45" y="102" font-size="20" font-weight="bold" fill="#e8711a">Cloudera AI project — CPU only, 2 vCPU / 4 GB</text>

  <!-- inference pipeline -->
  <rect x="50" y="190" width="190" height="100" rx="14" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="145" y="232" text-anchor="middle" font-size="19" font-weight="bold" fill="#1f2937">Sample images</text>
  <text x="145" y="260" text-anchor="middle" font-size="15" fill="#4b5563">data/ · synthetic, in Git</text>

  <rect x="300" y="190" width="210" height="100" rx="14" fill="#edf1f8" stroke="#8b9bb4" stroke-width="2"/>
  <text x="405" y="232" text-anchor="middle" font-size="19" font-weight="bold" fill="#1f2937">U-Net ONNX model</text>
  <text x="405" y="260" text-anchor="middle" font-size="14" fill="#4b5563">in-app · ONNX Runtime CPU</text>

  <rect x="570" y="190" width="200" height="100" rx="14" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="670" y="232" text-anchor="middle" font-size="19" font-weight="bold" fill="#1f2937">Saved inspections</text>
  <text x="670" y="260" text-anchor="middle" font-size="15" fill="#4b5563">outputs/inspections/</text>

  <!-- Streamlit application -->
  <rect x="840" y="115" width="320" height="270" rx="18" fill="#fbf0e6" stroke="#d9a77c" stroke-width="2.5"/>
  <text x="860" y="141" font-size="16" font-weight="bold" fill="#1f2937">Streamlit app</text>

  <rect x="860" y="155" width="280" height="60" rx="12" fill="#ffffff" stroke="#d9a77c" stroke-width="2"/>
  <text x="1000" y="181" text-anchor="middle" font-size="17" font-weight="bold" fill="#1f2937">Review UI</text>
  <text x="1000" y="202" text-anchor="middle" font-size="14" fill="#4b5563">grid · overlays · verdicts</text>

  <rect x="860" y="230" width="280" height="60" rx="12" fill="#ffffff" stroke="#d9a77c" stroke-width="2"/>
  <text x="1000" y="256" text-anchor="middle" font-size="17" font-weight="bold" fill="#1f2937">What-if panel</text>
  <text x="1000" y="277" text-anchor="middle" font-size="14" fill="#4b5563">threshold 0.30–0.80 · min region size</text>

  <rect x="860" y="305" width="280" height="60" rx="12" fill="#ffffff" stroke="#d9a77c" stroke-width="2"/>
  <text x="1000" y="331" text-anchor="middle" font-size="17" font-weight="bold" fill="#1f2937">QC agent</text>
  <text x="1000" y="352" text-anchor="middle" font-size="14" fill="#4b5563">≤ 4 tool calls · draft answers</text>

  <!-- LLM service, outside the project -->
  <rect x="850" y="480" width="300" height="76" rx="14" fill="#edf1f8" stroke="#8b9bb4" stroke-width="2"/>
  <text x="1000" y="512" text-anchor="middle" font-size="19" font-weight="bold" fill="#1f2937">Cloudera AI Inference</text>
  <text x="1000" y="538" text-anchor="middle" font-size="15" fill="#4b5563">LLM · OpenAI-compatible API</text>

  <!-- flows -->
  <g fill="none" stroke="#5b6577" stroke-width="3">
    <line x1="240" y1="240" x2="298" y2="240" marker-end="url(#g)"/>
    <line x1="510" y1="240" x2="568" y2="240" marker-end="url(#g)"/>
    <line x1="770" y1="240" x2="838" y2="240" marker-end="url(#g)"/>
    <polyline points="405,290 405,330 815,330 815,262 858,262" stroke-width="2.5" marker-end="url(#g)"/>
    <line x1="1000" y1="365" x2="1000" y2="478" stroke-width="3.5" marker-end="url(#g)"/>
  </g>
  <text x="610" y="354" text-anchor="middle" font-size="15" fill="#4b5563">re-run at new settings · nothing saved</text>
  <text x="1016" y="408" font-size="15" fill="#4b5563">chat + tool calls</text>
  <text x="1016" y="458" font-size="15" fill="#4b5563">token from /tmp/jwt</text>

  <text x="50" y="512" font-size="15" fill="#4b5563">All outputs are drafts for human review.</text>
  <text x="50" y="536" font-size="15" fill="#4b5563">The application never accepts or rejects material.</text>
</svg>
