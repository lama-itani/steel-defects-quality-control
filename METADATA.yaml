# Cloudera Blueprint catalog metadata
# Populate fields used by the master blueprint website and internal catalog.

# --- Identity ---
name: "Steel Surface QC"
slug: "steel-surface-qc"                      # URL-safe repo / catalog identifier
description: "Steel surface defect inspection with an in-app U-Net ONNX model, a human review interface, and a tool-using QC agent backed by Cloudera AI Inference."
reprise_link: ""                              # TODO: no Reprise demo recorded yet

# --- Classification (website filters) ---
catalog_classification:
  - Launchable (AMP)                          # Options: Enterprise Blueprint | Research | Launchable (AMP) | Developer Example
launchable: true                              # true | false
lifecycle_status: Active                      # e.g., Active | Deprecated

# --- Industry & alignment ---
industry: ""                                  # TODO: choose from the standard's list (e.g., General)
industry_alignment: "Vertical"                # Horizontal | Vertical
target_vertical: "Manufacturing Quality Control"   # Optional finer-grained vertical

# --- Tags (website search & browse) ---
tags:
  - computer-vision
  - defect-detection
  - quality-control
  - manufacturing
  - onnx
  - agents
  - human-in-the-loop

# --- Relationships ---
product_mapping:                              # Cloudera products used
  - Cloudera AI (Workbench)
  - Cloudera AI Inference Service
model_dependencies:                           # Models, embeddings, or external AI services
  - Qwen/Qwen2.5-7B-Instruct                  # Default LLM for the QC agent; set with QC_LLM_MODEL
  - Unet.onnx                                 # U-Net (ResNet34 encoder) shipped in model/

# --- Provenance ---
publisher: cloudera                           # cloudera | partner-name
source: Internal                              # Internal | Partner | NVIDIA Adaptation | Customer

